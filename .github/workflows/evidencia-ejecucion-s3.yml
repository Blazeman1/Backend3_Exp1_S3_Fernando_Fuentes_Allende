name: Evidencia S3 - Particionado y Benchmark

# Semana 3 (actividad sumativa individual): ejecuta el Job particionado nuevo
# (transaccionesDiariasParticionadoJob) y un benchmark comparativo que varia hilos,
# chunk-size y grid-size del Job de transacciones diarias, dejando como evidencia la
# linea "FIN JOB ... duracion=<N> ms" que imprime JobResumenListener en cada corrida.
#
# Se mantiene en un workflow SEPARADO de evidencia-ejecucion.yml (semanas 1-2) a proposito:
# ese workflow y su evidencia ya fueron validados y no se modifican. Este es puramente
# aditivo, igual que el codigo Java del particionado (ver TransaccionesParticionadoJobConfig).

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  particionado-y-benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banco_xyz
          POSTGRES_USER: banco_xyz
          POSTGRES_PASSWORD: banco_xyz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banco_xyz -d banco_xyz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Crear carpeta de evidencias
        run: mkdir -p evidencias-ci-s3

      - name: Compilar el proyecto (mvn clean package)
        run: mvn -B clean package | tee evidencias-ci-s3/evidencia-01-build.log

      - name: Ejecutar Job particionado (grid-size por defecto = 4)
        continue-on-error: true
        run: |
          java -jar target/banco-xyz-batch-1.0.0.jar transacciones-particionado \
            | tee evidencias-ci-s3/evidencia-02-job-transacciones-particionado.log

      - name: "Benchmark: variando hilos del Job multi-hilo (chunk-size fijo = 5)"
        continue-on-error: true
        run: |
          for hilos in 1 3 6; do
            echo "=== hilos=${hilos} chunk=5 ===" | tee -a evidencias-ci-s3/evidencia-03-benchmark-hilos.log
            java -jar target/banco-xyz-batch-1.0.0.jar transacciones \
              --batch.hilos=${hilos} --runId=bench-hilos-${hilos} \
              | tee -a evidencias-ci-s3/evidencia-03-benchmark-hilos.log
          done

      - name: "Benchmark: variando chunk-size del Job multi-hilo (hilos fijo = 3)"
        continue-on-error: true
        run: |
          for chunk in 1 5 20 50; do
            echo "=== hilos=3 chunk=${chunk} ===" | tee -a evidencias-ci-s3/evidencia-04-benchmark-chunk.log
            java -jar target/banco-xyz-batch-1.0.0.jar transacciones \
              --batch.chunk-size=${chunk} --runId=bench-chunk-${chunk} \
              | tee -a evidencias-ci-s3/evidencia-04-benchmark-chunk.log
          done

      - name: "Benchmark: variando grid-size del Job particionado (chunk-size fijo = 5)"
        continue-on-error: true
        run: |
          for grid in 1 2 4 6; do
            echo "=== gridSize=${grid} chunk=5 ===" | tee -a evidencias-ci-s3/evidencia-05-benchmark-gridsize.log
            java -jar target/banco-xyz-batch-1.0.0.jar transacciones-particionado \
              --batch.grid-size=${grid} --runId=bench-grid-${grid} \
              | tee -a evidencias-ci-s3/evidencia-05-benchmark-gridsize.log
          done

      - name: Consolidar resumen del benchmark
        continue-on-error: true
        run: |
          {
            echo "=== Resumen de duracion total por corrida (grep de 'FIN JOB' y encabezados '===') ==="
            grep -E "^=== |FIN JOB" \
              evidencias-ci-s3/evidencia-03-benchmark-hilos.log \
              evidencias-ci-s3/evidencia-04-benchmark-chunk.log \
              evidencias-ci-s3/evidencia-05-benchmark-gridsize.log
          } | tee evidencias-ci-s3/evidencia-06-resumen-benchmark.log

      - name: Publicar evidencias como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-ejecucion-s3-benchmark
          path: evidencias-ci-s3/
          retention-days: 90
          if-no-files-found: warn
